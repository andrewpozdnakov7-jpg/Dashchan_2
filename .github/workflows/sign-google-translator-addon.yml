name: Build and Sign Google Translator Add-on

run-name: Build and sign Google Translator Add-on from Slooop_Addons 63398ac1

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type SIGN GOOGLE TRANSLATOR ADDON to continue
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sign-google-translator-addon
  cancel-in-progress: false

env:
  SOURCE_REPOSITORY: andrewpozdnakov7-jpg/Slooop_Addons
  SOURCE_PR_NUMBER: '5'
  SOURCE_BRANCH: main
  SOURCE_HEAD_BRANCH: agent/fix-google-model-download-progress
  SOURCE_HEAD_COMMIT: 5ee42145c6efa961c01dc3afdef819f08ea10785
  SOURCE_COMMIT: 4a1bfe31602a57ba10ac8da894abaed2ee84fef8
  EXPECTED_CERT_SHA256: a9fbac6c498f7ad8e7c56849afe43881966bed2ed2bc1dd1c73d0ffe0b9ebeba
  EXPECTED_PACKAGE: io.dashchan2.addon.googletranslate
  EXPECTED_VERSION_NAME: 1.0.0
  EXPECTED_VERSION_CODE: '1'

jobs:
  build:
    name: Build pinned add-on source without signing secrets
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Confirm protected build request
        env:
          SIGNING_CONFIRMATION: ${{ inputs.confirmation }}
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          if [ "$SIGNING_CONFIRMATION" != 'SIGN GOOGLE TRANSLATOR ADDON' ]; then
            echo '::error::Signing confirmation does not match the required phrase'
            exit 1
          fi
          if [ "$REF_PROTECTED" != 'true' ]; then
            echo '::error::The workflow must run from protected master'
            exit 1
          fi

      - name: Verify merged source provenance
        run: |
          set -euo pipefail
          pr_json="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$SOURCE_REPOSITORY/pulls/$SOURCE_PR_NUMBER")"
          jq -e \
            --arg source_branch "$SOURCE_BRANCH" \
            --arg source_head_branch "$SOURCE_HEAD_BRANCH" \
            --arg source_head_commit "$SOURCE_HEAD_COMMIT" \
            --arg source_merge_commit "$SOURCE_COMMIT" \
            '.state == "closed" and .merged_at != null and
              .base.ref == $source_branch and .head.ref == $source_head_branch and
              .head.sha == $source_head_commit and
              .merge_commit_sha == $source_merge_commit' \
            <<< "$pr_json" >/dev/null

          commit_json="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$SOURCE_REPOSITORY/commits/$SOURCE_COMMIT")"
          jq -e \
            --arg source_commit "$SOURCE_COMMIT" \
            '.sha == $source_commit and .commit.verification.verified == true' \
            <<< "$commit_json" >/dev/null

      - name: Check out exact add-on source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: andrewpozdnakov7-jpg/Slooop_Addons
          ref: 63398ac1788964ea43467c843464f03f92401e3c
          path: source
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: source/translator-google/**/*.gradle*

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          sdkmanager="$android_sdk/cmdline-tools/latest/bin/sdkmanager"
          if [ -z "$android_sdk" ] || [ ! -x "$sdkmanager" ]; then
            echo "::error::sdkmanager not found at $sdkmanager"
            exit 1
          fi
          set +o pipefail
          yes | "$sdkmanager" --licenses >/dev/null
          set -o pipefail
          "$sdkmanager" 'platforms;android-37.0' 'build-tools;36.0.0'

      - name: Build unsigned universal APK
        working-directory: source/translator-google
        run: ./gradlew :app:assembleRelease -PaddonAbi=universal --console=plain

      - name: Verify ML Kit registrar constructors survive R8
        run: |
          set -euo pipefail
          mapping="source/translator-google/app/build/outputs/mapping/release/mapping.txt"
          python3 - "$mapping" <<'PY'
          import re
          import sys

          targets = {
              "com.google.mlkit.common.internal.CommonComponentRegistrar",
              "com.google.mlkit.nl.translate.NaturalLanguageTranslateRegistrar",
          }
          blocks = {}
          current = None
          with open(sys.argv[1], encoding="utf-8") as stream:
              for line in stream:
                  match = re.match(r"^([^ ].*?) -> .*:$", line.rstrip())
                  if match:
                      current = match.group(1)
                      if current in targets:
                          blocks[current] = []
                      continue
                  if current in blocks:
                      blocks[current].append(line)

          missing_classes = sorted(targets - blocks.keys())
          missing_constructors = sorted(
              name for name, lines in blocks.items()
              if not any("void <init>()" in line for line in lines)
          )
          if missing_classes or missing_constructors:
              raise SystemExit(
                  "ML Kit registrar R8 verification failed: "
                  f"missing_classes={missing_classes}, "
                  f"missing_constructors={missing_constructors}"
              )
          print("Verified ML Kit registrar constructors:", ", ".join(sorted(targets)))
          PY

      - name: Verify unsigned APK identity and process configuration
        env:
          UNSIGNED_APK: source/translator-google/app/build/outputs/apk/release/app-release-unsigned.apk
        run: |
          set -euo pipefail
          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          apksigner="$android_sdk/build-tools/36.0.0/apksigner"
          aapt="$android_sdk/build-tools/36.0.0/aapt"

          if "$apksigner" verify "$UNSIGNED_APK" >/dev/null 2>&1; then
            echo '::error::Source build unexpectedly produced a signed APK'
            exit 1
          fi

          badging="$("$aapt" dump badging "$UNSIGNED_APK")"
          grep -F "package: name='$EXPECTED_PACKAGE' versionCode='$EXPECTED_VERSION_CODE' versionName='$EXPECTED_VERSION_NAME'" \
            <<< "$badging" >/dev/null
          grep -Fx "native-code: 'arm64-v8a' 'armeabi-v7a' 'x86'" <<< "$badging" >/dev/null
          if grep -E 'application-debuggable|testOnly|profileable' <<< "$badging"; then
            echo '::error::Unsigned APK contains a debug or test-only marker'
            exit 1
          fi

          manifest="$("$aapt" dump xmltree "$UNSIGNED_APK" AndroidManifest.xml)"
          service_line="$(grep -nF 'io.dashchan2.addon.googletranslate.GoogleTranslationService' \
            <<< "$manifest" | head -n 1 | cut -d: -f1)"
          if [ -z "$service_line" ]; then
            echo '::error::GoogleTranslationService is missing from the manifest'
            exit 1
          fi
          service_block="$(sed -n "${service_line},$((service_line + 8))p" <<< "$manifest")"
          if grep -F 'android:process' <<< "$service_block"; then
            echo '::error::GoogleTranslationService still uses a secondary process'
            exit 1
          fi

          mkdir -p unsigned-artifacts
          cp "$UNSIGNED_APK" unsigned-artifacts/Slooop-Google-Translator-universal-unsigned.apk
          sha256sum unsigned-artifacts/Slooop-Google-Translator-universal-unsigned.apk

      - name: Upload isolated unsigned APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: google-translator-universal-unsigned-${{ github.run_id }}
          path: unsigned-artifacts/Slooop-Google-Translator-universal-unsigned.apk
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload R8 mapping for diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: google-translator-r8-mapping-${{ github.run_id }}
          path: source/translator-google/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 7

  sign:
    name: Sign isolated APK with Slooop release key
    needs: build
    environment: release-signing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download isolated unsigned APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: google-translator-universal-unsigned-${{ github.run_id }}
          path: unsigned-artifacts

      - name: Install Android signing tools
        run: |
          set -euo pipefail
          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          sdkmanager="$android_sdk/cmdline-tools/latest/bin/sdkmanager"
          if [ -z "$android_sdk" ] || [ ! -x "$sdkmanager" ]; then
            echo "::error::sdkmanager not found at $sdkmanager"
            exit 1
          fi
          "$sdkmanager" 'build-tools;34.0.0' 'build-tools;36.0.0'

      - name: Sign APK with Slooop release key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SOURCE_APK: unsigned-artifacts/Slooop-Google-Translator-universal-unsigned.apk
          SIGNED_APK: signed-artifacts/Slooop-Google-Translator-universal-release-signed.apk
        run: |
          set -euo pipefail
          umask 077
          for variable in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD \
              ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!variable:-}" ]; then
              echo "::error::Required release-signing secret is missing: $variable"
              exit 1
            fi
          done

          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          zipalign="$android_sdk/build-tools/36.0.0/zipalign"
          apksigner="$android_sdk/build-tools/34.0.0/apksigner"
          aligned_apk="$RUNNER_TEMP/google-translator-aligned.apk"
          keystore="$RUNNER_TEMP/slooop-release.jks"
          cleanup() {
            rm -f "$aligned_apk" "$keystore"
          }
          trap cleanup EXIT

          "$zipalign" -f -p 4 "$SOURCE_APK" "$aligned_apk"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          unset ANDROID_KEYSTORE_BASE64

          mkdir -p "$(dirname "$SIGNED_APK")"
          "$apksigner" sign \
            --ks "$keystore" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$SIGNED_APK" \
            "$aligned_apk"

      - name: Verify signed APK and unchanged payload
        env:
          SOURCE_APK: unsigned-artifacts/Slooop-Google-Translator-universal-unsigned.apk
          SIGNED_APK: signed-artifacts/Slooop-Google-Translator-universal-release-signed.apk
        run: |
          set -euo pipefail
          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          zipalign="$android_sdk/build-tools/36.0.0/zipalign"
          apksigner="$android_sdk/build-tools/34.0.0/apksigner"
          aapt="$android_sdk/build-tools/36.0.0/aapt"

          "$zipalign" -c -p 4 "$SIGNED_APK"
          verification="$("$apksigner" verify --verbose --print-certs "$SIGNED_APK")"
          actual_cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
            <<< "$verification" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          if [ "$actual_cert" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Release signing certificate mismatch: ${actual_cert:-missing}"
            exit 1
          fi
          grep -Fx 'Number of signers: 1' <<< "$verification" >/dev/null
          grep -Fx 'Verified using v3 scheme (APK Signature Scheme v3): true' \
            <<< "$verification" >/dev/null

          badging="$("$aapt" dump badging "$SIGNED_APK")"
          grep -F "package: name='$EXPECTED_PACKAGE' versionCode='$EXPECTED_VERSION_CODE' versionName='$EXPECTED_VERSION_NAME'" \
            <<< "$badging" >/dev/null
          grep -Fx "native-code: 'arm64-v8a' 'armeabi-v7a' 'x86'" <<< "$badging" >/dev/null
          if grep -E 'application-debuggable|testOnly|profileable' <<< "$badging"; then
            echo '::error::Signed APK contains a debug or test-only marker'
            exit 1
          fi

          python3 - "$SOURCE_APK" "$SIGNED_APK" <<'PY'
          import hashlib
          import sys
          import zipfile

          def payload(path):
              with zipfile.ZipFile(path) as archive:
                  return {
                      info.filename: hashlib.sha256(archive.read(info)).hexdigest()
                      for info in archive.infolist()
                      if not info.is_dir() and not is_signature_entry(info.filename)
                  }

          def is_signature_entry(name):
              upper = name.upper()
              if upper == "META-INF/MANIFEST.MF":
                  return True
              return upper.startswith("META-INF/") and upper.endswith(
                  (".SF", ".RSA", ".DSA", ".EC")
              )

          source = payload(sys.argv[1])
          signed = payload(sys.argv[2])
          if source != signed:
              missing = sorted(source.keys() - signed.keys())
              added = sorted(signed.keys() - source.keys())
              changed = sorted(name for name in source.keys() & signed.keys()
                               if source[name] != signed[name])
              raise SystemExit(
                  f"APK payload changed: missing={missing}, added={added}, changed={changed}"
              )
          print(f"Verified unchanged payload: {len(source)} entries")
          PY

          sha256="$(sha256sum "$SIGNED_APK" | cut -d ' ' -f 1)"
          size="$(stat -c '%s' "$SIGNED_APK")"
          {
            echo '## Google Translator Add-on signed artifact'
            echo
            echo "- Source repository: \`$SOURCE_REPOSITORY\`"
            echo "- Source PR: \`#$SOURCE_PR_NUMBER\`"
            echo "- Source commit: \`$SOURCE_COMMIT\`"
            echo "- Package: \`$EXPECTED_PACKAGE\`"
            echo "- Version: \`$EXPECTED_VERSION_NAME ($EXPECTED_VERSION_CODE)\`"
            echo '- ABIs: `arm64-v8a`, `armeabi-v7a`, `x86`'
            echo "- SHA-256: \`$sha256\`"
            echo "- Bytes: \`$size\`"
            echo "- Certificate SHA-256: \`$actual_cert\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verified signed add-on
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: google-translator-universal-release-signed
          path: signed-artifacts/Slooop-Google-Translator-universal-release-signed.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
