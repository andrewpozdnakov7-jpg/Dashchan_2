name: Slooop UI review
on: pull_request
permissions:
  contents: read
jobs:
  design:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check changed UI source only
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/design/audit.py check --base "$(git merge-base "$BASE" HEAD)"
