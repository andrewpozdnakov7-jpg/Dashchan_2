name: Android CI

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      distribution:
        description: Distribution profile
        required: true
        default: github
        type: choice
        options:
          - github
          - fdroid
      build_scope:
        description: Native ABI set
        required: true
        default: arm64
        type: choice
        options:
          - arm64
          - all

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Ndebug (${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_scope || 'arm64' }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NATIVE_ABIS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_scope == 'all' && 'arm64-v8a,armeabi-v7a,x86' || 'arm64-v8a' }}
      BUILD_TASK: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.distribution == 'fdroid' && 'assembleFdroidNdebug' || 'assembleGithubNdebug' }}

    steps:
      - name: Check out sources
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 2

      - name: Select validation path
        id: validation
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          build_required=true
          if [ "$EVENT_NAME" != 'workflow_dispatch' ] &&
              git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            mapfile -t changed_files < <(git diff --name-only HEAD^ HEAD)
            if [ "${#changed_files[@]}" -gt 0 ]; then
              build_required=false
              for path in "${changed_files[@]}"; do
                if [ "$path" != 'update/data.json' ]; then
                  build_required=true
                  break
                fi
              done
            fi
          fi

          echo "build_required=$build_required" >> "$GITHUB_OUTPUT"
          echo "APK build required: $build_required"

      - name: Validate update manifest
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          from urllib.parse import urlparse

          data = json.loads(Path("update/data.json").read_text(encoding="utf-8"))
          fingerprint = re.compile(r"^[0-9a-f]{64}$")
          for section in ("client", "dvach"):
              entries = data.get(section)
              if not isinstance(entries, list) or not entries:
                  raise SystemExit(f"Missing update section: {section}")
              for entry in entries:
                  if not isinstance(entry.get("code"), int) or entry["code"] <= 0:
                      raise SystemExit(f"Invalid code in {section}")
                  if not isinstance(entry.get("length"), int) or entry["length"] <= 0:
                      raise SystemExit(f"Invalid length in {section}")
                  parsed = urlparse(entry.get("source", ""))
                  if parsed.scheme != "https" or parsed.netloc != "github.com":
                      raise SystemExit(f"Invalid source URL in {section}")
                  if not fingerprint.fullmatch(entry.get("fingerprint", "")):
                      raise SystemExit(f"Invalid signing fingerprint in {section}")
          print("update/data.json is valid")
          PY

      - name: Record manifest-only fast path
        if: steps.validation.outputs.build_required != 'true'
        run: echo 'Only update/data.json changed; APK compilation is not required.'

      - name: Set up Java
        if: steps.validation.outputs.build_required == 'true'
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        if: steps.validation.outputs.build_required == 'true'
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Install native build tools
        if: steps.validation.outputs.build_required == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            bzip2 cmake curl meson nasm ninja-build pkg-config xz-utils

      - name: Install Android SDK components
        if: steps.validation.outputs.build_required == 'true'
        run: |
          ANDROID_SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          SDKMANAGER="$ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ -z "$ANDROID_SDK" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found at $SDKMANAGER"
            exit 1
          fi
          # sdkmanager closes stdin after the last prompt, which makes yes exit on SIGPIPE.
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" \
            'platform-tools' \
            'platforms;android-37.0' \
            'build-tools;36.0.0' \
            'ndk;29.0.14206865'

      - name: Prepare F-Droid native source inputs
        if: steps.validation.outputs.build_required == 'true' && env.BUILD_TASK == 'assembleFdroidNdebug'
        env:
          DAV1D_VERSION: '1.5.3'
          FFMPEG_VERSION: '8.1.2'
          YUV_VERSION: '6afd9becdf58822b1da6770598d8597c583ccfad'
        run: |
          set -euo pipefail
          source_root="$RUNNER_TEMP/fdroid-native-sources"
          bash Dashchan-Webm/shared-prepare.sh "$source_root"
          {
            echo "ORG_GRADLE_PROJECT_dashchanDav1dSourceDir=$source_root/dav1d"
            echo "ORG_GRADLE_PROJECT_dashchanFfmpegSourceDir=$source_root/ffmpeg"
            echo "ORG_GRADLE_PROJECT_dashchanLibyuvSourceDir=$source_root/yuv"
          } >> "$GITHUB_ENV"

      - name: Build APK
        if: steps.validation.outputs.build_required == 'true'
        run: |
          set -o pipefail
          chmod +x gradlew Dashchan-Webm/*.sh
          ./gradlew --no-daemon --stacktrace "$BUILD_TASK" \
            -PnativePlayerFfmpegFlavor=ffmpeg8 \
            -PnativeAbis="$NATIVE_ABIS" 2>&1 | tee build-main.log

      - name: Create APK checksums
        if: steps.validation.outputs.build_required == 'true'
        run: |
          set -euo pipefail
          mapfile -d '' apks < <(find build/outputs/apk -type f -name '*.apk' -print0 | sort -z)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo 'No APK files were produced' >&2
            exit 1
          fi
          sha256sum "${apks[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload APK, checksums and diagnostics
        if: always() && steps.validation.outputs.build_required == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.distribution || 'github' }}-ndebug-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_scope || 'arm64' }}-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/outputs/apk/**/*.apk
            SHA256SUMS.txt
            build-main.log
            build/reports/**
