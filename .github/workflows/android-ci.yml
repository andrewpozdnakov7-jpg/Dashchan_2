name: Android CI

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      distribution:
        description: Distribution profile
        required: true
        default: github
        type: choice
        options:
          - github
          - fdroid
      build_scope:
        description: Native ABI set
        required: true
        default: arm64
        type: choice
        options:
          - armv7
          - arm64
          - x86
          - all

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signing-workflow:
    name: Signing workflow (actionlint + provenance)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out sources
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 2

      - name: Install pinned actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          bin_dir="$RUNNER_TEMP/actionlint-bin"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check --strict
          mkdir -p "$bin_dir"
          tar -xzf "$archive" -C "$bin_dir" actionlint
          echo "$bin_dir" >> "$GITHUB_PATH"

      - name: Validate GitHub Actions workflows
        # SC2016 is a false positive for intentionally single-quoted Python heredocs.
        run: actionlint -ignore 'SC2016' .github/workflows/*.yml

      - name: Verify protected add-on source provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request
          from pathlib import Path

          path = Path(".github/workflows/sign-google-translator-addon.yml")
          text = path.read_text(encoding="utf-8")

          def workflow_value(name):
              match = re.search(
                  rf"^  {re.escape(name)}:\s*(?:'([^']*)'|([^#\s]+))\s*$",
                  text,
                  re.MULTILINE,
              )
              if not match:
                  raise SystemExit(f"Missing protected signing workflow value: {name}")
              return match.group(1) if match.group(1) is not None else match.group(2)

          repository = workflow_value("SOURCE_REPOSITORY")
          pr_number = workflow_value("SOURCE_PR_NUMBER")
          branch = workflow_value("SOURCE_BRANCH")
          head_branch = workflow_value("SOURCE_HEAD_BRANCH")
          head_commit = workflow_value("SOURCE_HEAD_COMMIT")
          merge_commit = workflow_value("SOURCE_COMMIT")

          for name, commit in {
              "SOURCE_HEAD_COMMIT": head_commit,
              "SOURCE_COMMIT": merge_commit,
          }.items():
              if not re.fullmatch(r"[0-9a-f]{40}", commit):
                  raise SystemExit(f"Invalid protected signing workflow SHA: {name}")

          checkout = re.compile(
              r"repository:\s*\$\{\{\s*env\.SOURCE_REPOSITORY\s*\}\}\s+"
              r"ref:\s*\$\{\{\s*env\.SOURCE_COMMIT\s*\}\}(?:\s|$)",
              re.MULTILINE,
          )
          if not checkout.search(text):
              raise SystemExit(
                  "Add-on checkout must use SOURCE_REPOSITORY and SOURCE_COMMIT"
              )

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "slooop-signing-provenance-check",
          }

          def github(path):
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/{path}", headers=headers
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          pull = github(f"pulls/{pr_number}")
          expected_pull = {
              "state": "closed",
              "base": branch,
              "head": head_branch,
              "head_sha": head_commit,
              "merge_commit_sha": merge_commit,
          }
          actual_pull = {
              "state": pull.get("state"),
              "base": pull.get("base", {}).get("ref"),
              "head": pull.get("head", {}).get("ref"),
              "head_sha": pull.get("head", {}).get("sha"),
              "merge_commit_sha": pull.get("merge_commit_sha"),
          }
          if pull.get("merged_at") is None or actual_pull != expected_pull:
              raise SystemExit(
                  f"Protected add-on source PR mismatch: expected={expected_pull}, "
                  f"actual={actual_pull}, merged_at={pull.get('merged_at')}"
              )

          commit = github(f"commits/{merge_commit}")
          verification = commit.get("commit", {}).get("verification", {})
          if commit.get("sha") != merge_commit or not verification.get("verified"):
              raise SystemExit(
                  f"Protected add-on source commit is not verified: {merge_commit}"
              )
          print(
              f"Verified {repository} PR #{pr_number} and merge commit {merge_commit}"
          )
          PY

  build:
    name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.distribution == 'fdroid' && 'Release' || 'Ndebug' }} (${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_scope || 'arm64' }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BUILD_SCOPE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_scope || 'arm64' }}
      NATIVE_ABIS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_scope == 'all' && 'arm64-v8a,armeabi-v7a,x86' || github.event_name == 'workflow_dispatch' && github.event.inputs.build_scope == 'armv7' && 'armeabi-v7a' || github.event_name == 'workflow_dispatch' && github.event.inputs.build_scope == 'x86' && 'x86' || 'arm64-v8a' }}
      BUILD_TASK: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.distribution == 'fdroid' && 'assembleFdroidRelease' || 'assembleGithubNdebug' }}

    steps:
      - name: Check out sources
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Select validation path
        id: validation
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          build_required=true
          if [ "$EVENT_NAME" = 'pull_request' ] &&
              git rev-parse --verify "$PR_BASE_SHA^{commit}" >/dev/null 2>&1 &&
              git rev-parse --verify "$PR_HEAD_SHA^{commit}" >/dev/null 2>&1; then
            mapfile -t changed_files < <(git diff --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA")
            printf 'Changed file: %s\n' "${changed_files[@]}"
            if [ "${#changed_files[@]}" -gt 0 ]; then
              build_required=false
              for path in "${changed_files[@]}"; do
                case "$path" in
                  README.md|CONTRIBUTING.md|SECURITY.md|CODE_OF_CONDUCT.md|docs/*|.github/ISSUE_TEMPLATE/*|.github/PULL_REQUEST_TEMPLATE.md|update/data.json|.github/workflows/sign-google-translator-addon.yml) ;;
                  *) build_required=true; break ;;
                esac
              done
            fi
          fi

          echo "build_required=$build_required" >> "$GITHUB_OUTPUT"
          echo "APK build required: $build_required"

      - name: Validate update manifest
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          from urllib.parse import urlparse

          data = json.loads(Path("update/data.json").read_text(encoding="utf-8"))
          fingerprint = re.compile(r"^[0-9a-f]{64}$")
          for section in ("client", "dvach"):
              entries = data.get(section)
              if not isinstance(entries, list) or not entries:
                  raise SystemExit(f"Missing update section: {section}")
              for entry in entries:
                  if not isinstance(entry.get("code"), int) or entry["code"] <= 0:
                      raise SystemExit(f"Invalid code in {section}")
                  if not isinstance(entry.get("length"), int) or entry["length"] <= 0:
                      raise SystemExit(f"Invalid length in {section}")
                  parsed = urlparse(entry.get("source", ""))
                  if parsed.scheme != "https" or parsed.netloc != "github.com":
                      raise SystemExit(f"Invalid source URL in {section}")
                  if not fingerprint.fullmatch(entry.get("fingerprint", "")):
                      raise SystemExit(f"Invalid signing fingerprint in {section}")
          print("update/data.json is valid")
          PY

      - name: Record validation-only fast path
        if: steps.validation.outputs.build_required != 'true'
        run: echo 'Only documentation, update metadata, or the protected signing workflow changed; APK compilation is not required.'

      - name: Set up Java
        if: steps.validation.outputs.build_required == 'true'
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        if: steps.validation.outputs.build_required == 'true'
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Install native build tools
        if: steps.validation.outputs.build_required == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            bzip2 cmake curl meson nasm ninja-build pkg-config xz-utils

      - name: Install Android SDK components
        if: steps.validation.outputs.build_required == 'true'
        run: |
          ANDROID_SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          SDKMANAGER="$ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ -z "$ANDROID_SDK" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found at $SDKMANAGER"
            exit 1
          fi
          # sdkmanager closes stdin after the last prompt, which makes yes exit on SIGPIPE.
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" \
            'platform-tools' \
            'platforms;android-37.0' \
            'build-tools;36.0.0' \
            'ndk;29.0.14206865'

      - name: Prepare F-Droid native source inputs
        if: steps.validation.outputs.build_required == 'true' && env.BUILD_TASK == 'assembleFdroidRelease'
        env:
          DAV1D_VERSION: '1.5.3'
          FFMPEG_VERSION: '8.1.2'
          YUV_VERSION: '6afd9becdf58822b1da6770598d8597c583ccfad'
        run: |
          set -euo pipefail
          source_root="$RUNNER_TEMP/fdroid-native-sources"
          bash Dashchan-Webm/shared-prepare.sh "$source_root"
          {
            echo "ORG_GRADLE_PROJECT_dashchanDav1dSourceDir=$source_root/dav1d"
            echo "ORG_GRADLE_PROJECT_dashchanFfmpegSourceDir=$source_root/ffmpeg"
            echo "ORG_GRADLE_PROJECT_dashchanLibyuvSourceDir=$source_root/yuv"
          } >> "$GITHUB_ENV"

      - name: Build APK
        if: steps.validation.outputs.build_required == 'true'
        run: |
          set -euo pipefail
          set -o pipefail
          chmod +x gradlew Dashchan-Webm/*.sh
          gradle_args=(
            -PnativePlayerFfmpegFlavor=ffmpeg8
            -PnativeAbis="$NATIVE_ABIS"
          )
          if [ "$BUILD_TASK" = 'assembleFdroidRelease' ] && [ "$BUILD_SCOPE" != 'all' ]; then
            release_version_code="$(python3 - <<'PY'
          import re
          from pathlib import Path

          text = Path('build.gradle').read_text(encoding='utf-8')
          matches = re.findall(r'^\s*versionCode\s*=\s*(\d+)\s*$', text, re.MULTILINE)
          if len(matches) != 1:
              raise SystemExit(f'Expected one literal versionCode, found {len(matches)}')
          print(matches[0])
          PY
            )"
            if [ $((release_version_code % 10)) -ne 0 ]; then
              echo "::error::Release versionCode must reserve its final digit for ABI splits: $release_version_code"
              exit 1
            fi
            case "$BUILD_SCOPE" in
              armv7) abi_offset=1 ;;
              arm64) abi_offset=2 ;;
              x86) abi_offset=3 ;;
              *) echo "::error::Unsupported F-Droid build scope: $BUILD_SCOPE"; exit 1 ;;
            esac
            package_version_code=$((release_version_code + abi_offset))
            gradle_args+=("-PpackageVersionCode=$package_version_code")
            echo "F-Droid package versionCode: $package_version_code"
          fi
          ./gradlew --no-daemon --stacktrace "$BUILD_TASK" "${gradle_args[@]}" \
            2>&1 | tee build-main.log

      - name: Verify retired beta update channel is absent
        if: steps.validation.outputs.build_required == 'true'
        run: |
          set -euo pipefail
          marker='andrewpozdnakov7-jpg/Dashchan_2_Update_Test'
          mapfile -d '' apks < <(find build/outputs/apk -type f -name '*.apk' -print0 | sort -z)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo 'No APK files were produced' >&2
            exit 1
          fi
          scan_root="$(mktemp -d)"
          trap 'rm -rf "$scan_root"' EXIT
          beta_reference_found=false
          for index in "${!apks[@]}"; do
            apk="${apks[$index]}"
            unpacked="$scan_root/$index"
            mkdir -p "$unpacked"
            unzip -qq "$apk" -d "$unpacked"
            if grep -aR -F -q "$marker" "$unpacked"; then
              beta_reference_found=true
              echo "Beta update reference found in $apk"
            fi
          done
          if [ "$beta_reference_found" = true ]; then
            echo '::error::APK contains the retired beta update repository reference'
            exit 1
          fi
          echo 'APK contains no retired beta update repository reference'

      - name: Create APK checksums
        if: steps.validation.outputs.build_required == 'true'
        run: |
          set -euo pipefail
          mapfile -d '' apks < <(find build/outputs/apk -type f -name '*.apk' -print0 | sort -z)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo 'No APK files were produced' >&2
            exit 1
          fi
          sha256sum "${apks[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload APK, checksums and diagnostics
        if: always() && steps.validation.outputs.build_required == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.distribution || 'github' }}-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.distribution == 'fdroid' && 'release' || 'ndebug' }}-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_scope || 'arm64' }}-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/outputs/apk/**/*.apk
            SHA256SUMS.txt
            build-main.log
            build/reports/**
